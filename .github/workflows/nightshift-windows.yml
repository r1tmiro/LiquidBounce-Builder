name: Night Shift - Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['arena/fd5cae78-liquidbounce-builder']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/nightshift-windows.yml'
permissions:
  contents: read
  checks: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download official Electron runtime
        run: node node_modules/electron/install.js
      - name: Logic and real two-client networking tests
        run: npm run test:logic
      - name: Build renderer
        run: npm run build
      - name: Smoke test real Electron on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $p = Start-Process -FilePath "node_modules/electron/dist/electron.exe" -ArgumentList ". --smoke-test" -PassThru -Wait -NoNewWindow -RedirectStandardOutput artifacts/electron-stdout.txt -RedirectStandardError artifacts/electron-stderr.txt
          if ($p.ExitCode -ne 0) { throw "Electron smoke test failed with exit code $($p.ExitCode)" }
          if (!(Test-Path artifacts/electron-smoke.json)) { throw "No smoke test report produced" }
          Get-Content artifacts/electron-smoke.json
      - name: Publish Electron diagnostic report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = ['electron-smoke.json','electron-smoke-error.txt','electron-stdout.txt','electron-stderr.txt'];
            let text = '';
            for (const f of files) if(fs.existsSync('artifacts/'+f)) text += '\n## '+f+'\n```\n'+fs.readFileSync('artifacts/'+f,'utf8').slice(-10000)+'\n```\n';
            await github.rest.checks.create({...context.repo, name:'Electron diagnostics', head_sha:context.sha, status:'completed', conclusion:fs.existsSync('artifacts/electron-smoke.json')?'success':'neutral', output:{title:'Windows Electron diagnostic files', summary:text || 'No diagnostic files produced.'}});
      - name: Build Windows installer and portable executable
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable --x64 --publish never 2>&1 | Tee-Object artifacts/build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 300 | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-test
          path: artifacts/
          if-no-files-found: ignore
