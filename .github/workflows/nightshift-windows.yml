name: Night Shift - Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['arena/fd5cae78-liquidbounce-builder']
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - 'package*.json'
      - '.github/workflows/nightshift-windows.yml'
permissions:
  contents: write
  checks: write
concurrency:
  group: nightshift-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download official Electron runtime
        run: node node_modules/electron/install.js
      - name: Logic and real two-client networking tests
        run: npm run test:logic
      - name: Build renderer
        run: npm run build
      - name: Smoke test real Electron on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $p = Start-Process -FilePath "node_modules/electron/dist/electron.exe" -ArgumentList ". --smoke-test" -PassThru -Wait -NoNewWindow -RedirectStandardOutput artifacts/electron-stdout.txt -RedirectStandardError artifacts/electron-stderr.txt
          if ($p.ExitCode -ne 0) { throw "Electron smoke test failed with exit code $($p.ExitCode)" }
          if (!(Test-Path artifacts/electron-smoke.json)) { throw "No smoke test report produced" }
          Get-Content artifacts/electron-smoke.json
      - name: Publish Electron diagnostic report
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const files = ['electron-smoke.json','electron-smoke-error.txt','electron-stdout.txt','electron-stderr.txt'];
            let text = '';
            for (const f of files) if(fs.existsSync('artifacts/'+f)) text += '\n## '+f+'\n```\n'+fs.readFileSync('artifacts/'+f,'utf8').slice(-10000)+'\n```\n';
            await github.rest.checks.create({...context.repo, name:'Electron diagnostics', head_sha:context.sha, status:'completed', conclusion:fs.existsSync('artifacts/electron-smoke.json')?'success':'neutral', output:{title:'Windows Electron diagnostic files', summary:text || 'No diagnostic files produced.'}});
      - name: Build Windows installer and portable executable
        shell: pwsh
        run: |
          npx electron-builder --win nsis portable --x64 --publish never 2>&1 | Tee-Object artifacts/build-log.txt
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed" }
      - name: Smoke test packaged executable
        shell: pwsh
        env:
          SMOKE_OUTPUT: artifacts/packaged
        run: |
          New-Item -ItemType Directory -Force artifacts/packaged | Out-Null
          $p = Start-Process -FilePath "release/win-unpacked/Night Shift.exe" -ArgumentList "--smoke-test" -PassThru -Wait -NoNewWindow -RedirectStandardOutput artifacts/packaged/stdout.txt -RedirectStandardError artifacts/packaged/stderr.txt
          if ($p.ExitCode -ne 0) { throw "Packaged executable failed: $($p.ExitCode)" }
          if (!(Test-Path artifacts/packaged/electron-smoke.json)) { throw "No packaged smoke report" }
          Get-Content artifacts/packaged/electron-smoke.json
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -AutoSize | Out-String -Width 300 | Set-Content release/SHA256SUMS.txt
      - name: Publish downloadable executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem release/*.exe).FullName
          gh release create nightshift-prototype-1.0.0 @files release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Night Shift - playable prototype 1.0.0" --prerelease --notes "Unofficial Among Us-inspired horror prototype. Windows x64. Includes a local multiplayer server; LAN or an externally reachable server address is required for online play. Unsigned build. Automated logic, networking and Windows Electron smoke tests are run before publishing. Not a commercial AAA game."
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-test
          path: artifacts/
          if-no-files-found: ignore

      - name: Publish packaging diagnostics
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs=require('fs');
            let summary='';
            for(const f of ['artifacts/build-log.txt','artifacts/packaged/electron-smoke.json','artifacts/packaged/electron-smoke-error.txt','artifacts/packaged/stdout.txt','artifacts/packaged/stderr.txt']) if(fs.existsSync(f)) summary += '\n## '+f+'\n```\n'+fs.readFileSync(f,'utf8').slice(-10000)+'\n```\n';
            await github.rest.checks.create({...context.repo,name:'Packaging diagnostics',head_sha:context.sha,status:'completed',conclusion:'neutral',output:{title:'Packaging and packaged EXE test',summary:summary || 'No files.'}});
