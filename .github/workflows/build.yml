name: Build LiquidBounce v0.41.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download LiquidBounce v0.41.0
        uses: actions/checkout@v4
        with:
          repository: CCBlueX/LiquidBounce
          ref: v0.41.0

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build LiquidBounce
        run: ./gradlew build --no-daemon

      - name: Find generated JAR files
        if: success()
        run: find . -path '*/build/libs/*.jar' -type f

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBounce-v0.41.0-JAR
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
          if-no-files-found: error
